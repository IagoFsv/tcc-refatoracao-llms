# Catalog of the code smells in the study.
#
# For each smell: the canonical name, the definition and the indicated
# refactoring technique (which fill {smell}, {definition} and {technique} in
# the three prompts), and the demonstrative before/after pair (which fills the
# example block, only in few_shot.txt).
#
# The pairs do not come from the study instances, so the sample is not
# contaminated. The MNC pair covers both forms that Pysmell measures: nested
# literal (DNC/NCT) and chained index access (LEC).

LM:
  name: "Long Method"
  definition: "A method or function that exceeds a considerable length."
  technique: "Extract Method"
  example_before: |-
    def process_order(order):
        for item in order['items']:
            if item['quantity'] <= 0:
                raise ValueError(f"Invalid quantity: {item['name']}")
            if item['price'] <= 0:
                raise ValueError(f"Invalid price: {item['name']}")
        subtotal = 0
        for item in order['items']:
            subtotal += item['quantity'] * item['price']
        discount = 0
        if order['customer']['type'] == 'premium':
            discount = subtotal * 0.15
        elif order['customer']['type'] == 'regular':
            discount = subtotal * 0.05
        total = subtotal - discount
        summary = f"Customer: {order['customer']['name']}\n"
        summary += f"Subtotal: $ {subtotal:.2f}\n"
        summary += f"Discount: $ {discount:.2f}\n"
        summary += f"Total: $ {total:.2f}\n"
        return summary
  example_after: |-
    def _validate_items(items):
        for item in items:
            if item['quantity'] <= 0:
                raise ValueError(f"Invalid quantity: {item['name']}")
            if item['price'] <= 0:
                raise ValueError(f"Invalid price: {item['name']}")

    def _compute_subtotal(items):
        return sum(item['quantity'] * item['price'] for item in items)

    def _compute_discount(subtotal, customer_type):
        if customer_type == 'premium':
            return subtotal * 0.15
        elif customer_type == 'regular':
            return subtotal * 0.05
        return 0

    def _build_summary(customer, subtotal, discount):
        total = subtotal - discount
        summary = f"Customer: {customer['name']}\n"
        summary += f"Subtotal: $ {subtotal:.2f}\n"
        summary += f"Discount: $ {discount:.2f}\n"
        summary += f"Total: $ {total:.2f}\n"
        return summary

    def process_order(order):
        _validate_items(order['items'])
        subtotal = _compute_subtotal(order['items'])
        discount = _compute_discount(subtotal, order['customer']['type'])
        return _build_summary(order['customer'], subtotal, discount)

LPL:
  name: "Long Parameter List"
  definition: "A method or function with an extensive list of parameters."
  technique: "Introduce Parameter Object"
  example_before: |-
    def register_product(name, price, quantity, category, supplier, discount):
        product = {
            'name': name,
            'price': price,
            'quantity': quantity,
            'category': category,
            'supplier': supplier,
            'discount': discount
        }
        database.save(product)
        return product
  example_after: |-
    from dataclasses import dataclass, asdict

    @dataclass
    class Product:
        name: str
        price: float
        quantity: int
        category: str
        supplier: str
        discount: float

    def register_product(product: Product):
        database.save(asdict(product))
        return product

LLF:
  name: "Long Lambda Function"
  definition: "A lambda function that exceeds a considerable length."
  technique: "Replace Lambda with Named Function"
  example_before: |-
    sort_items = lambda items, key, reverse_order, threshold: sorted(
        [i for i in items if i[key] > threshold],
        key=lambda x: x[key],
        reverse=reverse_order
    )
  example_after: |-
    def sort_items(items, key, reverse_order, threshold):
        filtered_items = [i for i in items if i[key] > threshold]
        return sorted(filtered_items, key=lambda x: x[key], reverse=reverse_order)

MNC:
  name: "Multiply-Nested Container"
  definition: "A container (i.e., set, list, tuple, and dict) with deep nesting, or an expression that accesses an object through a long chain of elements by the bracket operator, such as data['a']['b']['c']."
  technique: "Decompose Container"
  example_before: |-
    data = {
        'orders': [
            {
                'customer': {
                    'name': 'Ana',
                    'address': {'city': 'Fortaleza', 'zip_code': '60000-000'}
                },
                'items': [
                    {'product': 'pen', 'qty': 2},
                    {'product': 'notebook', 'qty': 1}
                ]
            }
        ]
    }

    def first_order_city(data):
        return data['orders'][0]['customer']['address']['city']
  example_after: |-
    from dataclasses import dataclass, field
    from typing import List

    @dataclass
    class Address:
        city: str
        zip_code: str

    @dataclass
    class Customer:
        name: str
        address: Address

    @dataclass
    class Item:
        product: str
        qty: int

    @dataclass
    class Order:
        customer: Customer
        items: List[Item] = field(default_factory=list)

    data = [
        Order(
            customer=Customer(
                name='Ana',
                address=Address(city='Fortaleza', zip_code='60000-000')
            ),
            items=[Item('pen', 2), Item('notebook', 1)]
        )
    ]

    def first_order_city(data):
        return data[0].customer.address.city

LTCE:
  name: "Long Ternary Conditional Expression"
  definition: "A ternary conditional expression that exceeds a considerable length."
  technique: "Replace Ternary Expression with If Statement"
  example_before: |-
    def shipping_label(order):
        label = (
            f"EXPRESS | {order['customer'].upper()} | {order['city']} | {order['weight_kg']:.1f} kg"
            if order['priority'] and order['weight_kg'] <= 5
            else f"STANDARD | {order['customer']} | {order['city']}"
        )
        return label
  example_after: |-
    def shipping_label(order):
        if order['priority'] and order['weight_kg'] <= 5:
            label = f"EXPRESS | {order['customer'].upper()} | {order['city']} | {order['weight_kg']:.1f} kg"
        else:
            label = f"STANDARD | {order['customer']} | {order['city']}"
        return label

CCC:
  name: "Complex Container Comprehension"
  definition: "A container comprehension (i.e., list, set, and dict comprehension, along with generator expression) with excessive complexity."
  technique: "Replace Comprehension with For Loop"
  example_before: |-
    def low_stock_report(warehouses):
        return [
            (warehouse['name'], product['sku'], product['qty'])
            for warehouse in warehouses
            if warehouse['active']
            for product in warehouse['products']
            if product['qty'] < product['min_qty']
        ]
  example_after: |-
    def low_stock_report(warehouses):
        report = []
        for warehouse in warehouses:
            if warehouse['active']:
                for product in warehouse['products']:
                    if product['qty'] < product['min_qty']:
                        report.append((warehouse['name'], product['sku'], product['qty']))
        return report
