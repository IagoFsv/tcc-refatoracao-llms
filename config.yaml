# Configuration of the evaluated models, all local, through Ollama.
#
# Tags and digests checked against the Ollama library and the installed
# Ollama (GET /api/tags). The client aborts the run if the installed digest
# differs from the one here: an "ollama pull" would swap the model silently.
# Same quantization (Q4_K_M) for all three, so it does not vary together with
# the model.

ollama:
  # 127.0.0.1 and not localhost: on Windows, localhost tries IPv6 first and
  # every request waits about 2 s before falling back to IPv4.
  base_url: "http://127.0.0.1:11434"
  # Version everything was checked with. The generation loop
  # (generation/generate.py) aborts if the installed Ollama is a different
  # one: the Windows app updates itself, and a new version may change
  # defaults and the underlying llama.cpp.
  version: "0.33.2"

# Goes into "options" of POST /api/chat, the same for every model and
# technique. Everything is explicit: what is not sent falls back to the
# Ollama defaults (temperature 0.8, top_k 40, top_p 0.9), meant for chat and
# subject to change between versions.
options:
  # > 0 on purpose: keeps the variability between the 3 runs of each
  # instance.
  temperature: 0.5
  # Window of Llama 3 (8,192), the smallest of the three. num_predict = half,
  # so prompt + output never exceed the window if the prompt has at most
  # 4,096 tokens.
  num_ctx: 8192
  num_predict: 4096
  # Values that disable each sampler in llama.cpp: only the temperature acts.
  top_k: 0
  top_p: 1.0
  min_p: 0.0
  repeat_penalty: 1.0

# One seed per run (1, 2 and 3), the same for every model and technique.
# The same seed with the same temperature would give identical runs.
seeds: [42, 43, 44]

# Top-level fields of POST /api/chat. With false, a prompt larger than num_ctx
# raises an error instead of being cut silently (truncate), and generation
# does not discard the start of the context when it reaches the limit (shift).
request:
  truncate: false
  shift: false

models:
  - name: qwen
    tag: "qwen2.5-coder:7b-instruct-q4_K_M"
    digest: "dae161e27b0e90dd1856c8bb3209201fd6736d8eb66298e75ed87571486f4364"

  - name: deepseek
    tag: "deepseek-coder:6.7b-instruct-q4_K_M"
